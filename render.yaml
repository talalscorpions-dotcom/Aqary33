databases:
  - name: aqary-db
    plan: free
    databaseName: aqary
    user: aqary

services:
  - type: web
    name: aqary-backend
    runtime: node
    rootDir: aqary_backend
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aqary-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_JWT_EXPIRES_IN
        value: 1h
      - key: RESET_PASSWORD_BASE_URL
        value: https://app.aqary.om/reset-password
      - key: AWS_REGION
        value: me-south-1
      - key: S3_BUCKET_MEDIA
        value: aqary-property-media
      - key: S3_BUCKET_DOCUMENTS
        value: aqary-verification-docs
