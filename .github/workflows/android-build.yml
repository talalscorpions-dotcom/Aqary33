name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check Flutter Project
        run: |
          echo "=== Current Directory ==="
          pwd
          echo "=== Directory Contents ==="
          ls -la
          echo "=== Finding pubspec.yaml ==="
          find . -name "pubspec.yaml" -type f
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          cache: true
      
      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << EOF
          org.gradle.jvmargs=-Xmx2048m -XX:+UseG1GC
          org.gradle.parallel=true
          org.gradle.workers.max=4
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          flutter config --enable-android
      
      - name: Fix Groovy XML dependency
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -type f | head -1 | xargs dirname)
          BUILD_GRADLE="$PROJECT_DIR/android/build.gradle"
          
          if [ -f "$BUILD_GRADLE" ]; then
            # Check if groovy-xml is already present
            if ! grep -q "groovy-xml" "$BUILD_GRADLE"; then
              # Add groovy-xml to the dependencies block
              perl -i -pe 's/(dependencies\s*\{)/$1\n        classpath "org.codehaus.groovy:groovy-xml:3.0.21"/' "$BUILD_GRADLE"
              echo "Added groovy-xml dependency"
            else
              echo "groovy-xml dependency already present"
            fi
          else
            echo "build.gradle not found at $BUILD_GRADLE"
          fi
      
      - name: Clean Gradle cache
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -type f | head -1 | xargs dirname)
          cd "$PROJECT_DIR"
          flutter clean
          ./android/gradlew clean -p android/ || true
      
      - name: Get dependencies
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -type f | head -1 | xargs dirname)
          cd "$PROJECT_DIR"
          flutter pub get
      
      - name: Run tests
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -type f | head -1 | xargs dirname)
          cd "$PROJECT_DIR"
          flutter test
      
      - name: Build Android APK
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -type f | head -1 | xargs dirname)
          cd "$PROJECT_DIR"
          flutter build apk --release
      
      - name: Build Android App Bundle
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -type f | head -1 | xargs dirname)
          cd "$PROJECT_DIR"
          flutter build appbundle --release
      
      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/
      
      - name: Post build status to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Android build completed successfully! APK and App Bundle available in Actions.'
            })
