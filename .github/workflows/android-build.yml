name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          cache: true
      
      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << EOF
          org.gradle.jvmargs=-Xmx2048m -XX:+UseG1GC
          org.gradle.parallel=true
          org.gradle.workers.max=4
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          flutter config --enable-android
      
      - name: Get dependencies
        run: |
          cd ./aqary_app
          flutter pub get
      
      - name: Clean build
        run: |
          cd ./aqary_app
          flutter clean
          ./android/gradlew clean -p android/ || true
      
      - name: Run tests
        run: |
          cd ./aqary_app
          flutter test
      
      - name: Build Android APK
        run: |
          cd ./aqary_app
          flutter build apk --release
      
      - name: Build Android App Bundle
        run: |
          cd ./aqary_app
          flutter build appbundle --release
      
      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: aqary_app/build/app/outputs/
      
      - name: Post build status to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Android build completed successfully! APK and App Bundle available in Actions.'
            })
