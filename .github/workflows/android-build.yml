name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check Flutter Project
        run: |
          echo "=== Current Directory ==="
          pwd
          echo "=== Directory Contents ==="
          ls -la
          echo "=== Finding pubspec.yaml ==="
          find . -name "pubspec.yaml" -type f
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          cache: true
      
      - name: Get dependencies
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -type f | head -1 | xargs dirname)
          cd "$PROJECT_DIR"
          flutter pub get
      
      - name: Run tests
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -type f | head -1 | xargs dirname)
          cd "$PROJECT_DIR"
          flutter test
      
      - name: Build Android APK
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -type f | head -1 | xargs dirname)
          cd "$PROJECT_DIR"
          flutter build apk --release
      
      - name: Build Android App Bundle
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -type f | head -1 | xargs dirname)
          cd "$PROJECT_DIR"
          flutter build appbundle --release
      
      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/
      
      - name: Post build status to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Android build completed successfully! APK and App Bundle available in Actions.'
            })
