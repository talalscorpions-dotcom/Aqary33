name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'aqary_backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'aqary_backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aqary
          POSTGRES_PASSWORD: aqary
          POSTGRES_DB: aqary
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://aqary:aqary@localhost:5432/aqary
      DATABASE_SSL: "false"
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRES_IN: 7d
      ADMIN_JWT_EXPIRES_IN: 1h
      AWS_REGION: me-south-1
      S3_BUCKET_MEDIA: aqary-property-media
      S3_BUCKET_DOCUMENTS: aqary-verification-docs

    defaults:
      run:
        working-directory: aqary_backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aqary_backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check every source file
        run: find src -name "*.js" -exec node -c {} \;

      - name: Run database migrations
        run: npm run migrate

      - name: Start server and check /health
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/health; then
              echo "Server is healthy"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become healthy in time"
          kill $SERVER_PID || true
          exit 1
